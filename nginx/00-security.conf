# Security rules shared by every gas24 vhost. Mounted into vhost.common.d as
# 00-security.conf so its regex locations are checked before the image's
# 10-php.conf (nginx uses the first matching regex location in file order).

# Never serve dotfiles (.git, .env*, .gitignore). /.well-known/ stays public
# because Android App Links verification reads assetlinks.json from there.
location ~ /\.(?!well-known/) {
    deny all;
}

# The api/ folder only exposes the gateway entry point; config.php and any
# other file in it must not be reachable directly.
location ~ ^/api/(?!index\.php(/|$)) {
    deny all;
}

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers only honour this over HTTPS; it stops later plain-HTTP visits, so
# the login cookie (set by the app without the Secure flag) never travels unencrypted.
add_header Strict-Transport-Security "max-age=31536000" always;
