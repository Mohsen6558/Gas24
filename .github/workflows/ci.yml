name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site and API gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: for f in src/api/*.php tools/*.php; do php -l "$f"; done

      - name: Site checks (JSON, broken links, provinces, service worker)
        run: python3 tools/check_site.py

      - name: Gateway tests
        run: bash tools/test_gateway.sh

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.GAS24_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gas24-release.jks"
          echo "GAS24_KEYSTORE_FILE=$RUNNER_TEMP/gas24-release.jks" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        env:
          GAS24_KEYSTORE_PASSWORD: ${{ secrets.GAS24_KEYSTORE_PASSWORD }}
          GAS24_KEY_ALIAS: ${{ secrets.GAS24_KEY_ALIAS }}
          GAS24_KEY_PASSWORD: ${{ secrets.GAS24_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease -Pgas24.versionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: gas24-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
