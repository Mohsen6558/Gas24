services:
  my-app:
    image: webdevops/php-nginx:8.3
    container_name: gas24
    restart: unless-stopped
    ports:
      - "8042:80"
    volumes:
      - ./src:/app
      - ./api.conf:/opt/docker/etc/nginx/vhost.common.d/api.conf:ro
      - ./nginx/00-security.conf:/opt/docker/etc/nginx/vhost.common.d/00-security.conf:ro
      - ./tools:/opt/gas24-tools:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # نسخه احتمالی HTTPS سرور اردبیل (فعلاً درگاه از 192.168.4.14:8003 استفاده می‌کند)
      - "es.nigc-ar.ir:192.168.4.10"
      - "es.nigc-kerman.ir:46.249.126.229"
      - "e.nigc-sbgc.ir:85.185.75.66"
      # کاندید سرور آذربایجان شرقی؛ در src/api/config.php هنوز وصل نشده
      - "moshtarak.nigc-eazar.ir:78.38.0.107"
      - "es.nigc-nkgc.ir:78.38.105.70"
      - "southkhorasan.artadata.ir:192.168.4.10"
      - "nigc-hm.artadata.ir:192.168.4.10"
      - "portal.nigc-khgc.ir:217.219.225.138"
      - "dpd.farsgas.ir:185.143.233.238"
      - "ilam.artadata.ir:192.168.4.10"
    environment:
      - WEB_DOCUMENT_ROOT=/app
      - PHP_DATE_TIMEZONE=Asia/Tehran
      # درگاه API هر درخواست را حداکثر ۱۵ ثانیه نگه می‌دارد و بدنه‌ها کوچک‌اند
      - PHP_MEMORY_LIMIT=256M
      # 1 = لاگ بدنه درخواست/پاسخ (با پوشاندن فیلدهای حساس) فقط برای عیب‌یابی موقت
      - GAS24_DEBUG=0
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
